name: Actualiser la situation aérienne récente

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-live
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Télécharger l’instantané ADS-B
        run: |
          curl --fail --retry 3 --retry-delay 10 \
            "https://api.adsb.lol/v2/lat/49.08/lon/2.10/dist/45" \
            --output /tmp/adsb-live.json
          jq --arg fetched_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '{fetched_at: $fetched_at, source: "ADSB.lol", ac: (.ac // [])}' \
            /tmp/adsb-live.json > /tmp/live.json

      - name: Mettre à jour la branche live
        run: |
          git fetch origin live
          git switch live
          mkdir -p data
          cp /tmp/live.json data/live.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/live.json
          git commit --amend --no-edit
          git push --force-with-lease origin live
